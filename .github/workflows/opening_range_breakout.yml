name: 5-Minute Opening Range Breakout (Paper 25)

on:
  schedule:
    # 09:35 AM EDT (13:35 UTC / 07:05 PM IST) Mon-Fri: Immediate Opening Range Breakout Execution
    - cron: '35 13 * * 1-5'
  workflow_dispatch: # Manual on-demand trigger

jobs:
  opening-range-breakout:
    name: ORB Stocks in Play Breakout Execution
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run Paper 25 Opening Range Breakout
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL || secrets.TRADE_BOT }}
        run: |
          python -u -m src.opening_range_runner

      - name: Upload ORB Session Artifact
        uses: actions/upload-artifact@v4
        with:
          name: orb-session-${{ github.run_id }}
          path: results/opening_range_latest.json
          retention-days: 14

      - name: Commit & Push Updated Portfolio State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto): update simulated paper portfolio & ORB breakout log [skip ci]"
            git push origin main
          else
            echo "No portfolio changes to commit."
          fi

