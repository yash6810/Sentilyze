name: 🚨 Automated Workflow Failure & Security Issue Triager

on:
  workflow_run:
    workflows:
      - "AI Trading Pipeline (CI/CD)"
      - "🤖 Autonomous Live Trading & Self-Improving Agent Daemon"
      - "Weekly Model Retraining & Drift Check"
      - "5-Minute Autonomous Intraday Market Guardian"
      - "Multi-Agent Trading Committee Audit"
      - "Daily Pre-Market Intelligence Briefing"

    types:
      - completed
  schedule:
    # Daily check at 06:00 UTC (11:30 AM IST)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  triage-workflow-failure:
    name: Auto-Create GitHub Issue on Pipeline Failures
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: File Automated GitHub Issue for Failed Pipeline
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const wfName = context.payload.workflow_run ? context.payload.workflow_run.name : "Manual Diagnostic Run";
            const runUrl = context.payload.workflow_run ? context.payload.workflow_run.html_url : `https://github.com/${context.repo.owner}/${context.repo.repo}/actions`;
            const commitSha = context.payload.workflow_run ? context.payload.workflow_run.head_sha.substring(0, 7) : context.sha.substring(0, 7);

            const title = `🚨 [CI/CD Alert] Failure in ${wfName} (Commit ${commitSha})`;
            const body = `### 🚨 Automated Pipeline Diagnostic Notice

            **Workflow**: \`${wfName}\`
            **Status**: ❌ **FAILURE**
            **Commit**: \`${commitSha}\`
            **Action Run URL**: [View Failed Job Logs](${runUrl})

            ---
            ### 🔍 Recommended Troubleshooting Actions:
            1. Check the logs in the failed job run linked above.
            2. Verify API secrets (\`NEWS_API_KEY\`, \`FINNHUB_API_KEY\`, \`POLYGON_API_KEY\`).
            3. Run local unit tests: \`.venv\\Scripts\\pytest.exe\`.
            4. Check Bandit security scan: \`.venv\\Scripts\\bandit.exe -r src/ -l\`.

            *This issue was automatically generated by Sentilyze Repo Issue Triager.*`;

            // Check if open issue already exists for this workflow
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['automated-alert', 'ci-failure']
            });

            const existingIssue = issues.data.find(i => i.title.includes(wfName));

            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['automated-alert', 'ci-failure', 'bug']
              });
              console.log(`Created new issue for ${wfName}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `🔄 **Repeat Failure Detected**: Pipeline \`${wfName}\` failed again on commit \`${commitSha}\`.\n[View Latest Run](${runUrl})`
              });
              console.log(`Appended comment to existing issue #${existingIssue.number}`);
            }
