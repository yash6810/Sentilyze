name: Nightly Data Lake Sync

on:
  schedule:
    # Runs every day at 00:00 UTC (5:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

concurrency:
  group: repo-state
  cancel-in-progress: false

jobs:
  sync-data:
    name: Sync Market Prices & News
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Sync Market Data & News
        env:
          PYTHONPATH: .
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          python -u -m src.data_sync


      - name: Commit & Push Synced Data Lake Summary
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/data_sync_latest.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): nightly data lake sync [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break || {
                if [ $i -eq 3 ]; then echo "Push failed after 3 attempts"; exit 1; fi
                sleep 5
              }
            done
          else
            echo "No data sync changes to commit."
          fi

