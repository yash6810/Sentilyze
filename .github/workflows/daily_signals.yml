name: Daily Market Signal Bot

on:
  schedule:
    # Runs Monday through Saturday at 01:30 UTC (7:00 AM IST / Morning market & weekend digest)
    - cron: '30 1 * * 1-6'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  scan-and-alert:
    name: Generate Signals & Dispatch Alerts
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run Daily Market Scanner
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL || secrets.TRADE_BOT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u -m src.daily_scanner

      - name: Upload Daily Signals Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-signals-${{ github.run_id }}
          path: results/daily_signals_latest.json
          retention-days: 14

      - name: Commit & Push Updated Live Data and Signals
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ results/
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): sync latest market prices, news sentiment, and daily signals [skip ci]"
            git pull --rebase origin main || git pull origin main --no-rebase -X ours || true
            git push origin main || echo "No changes or push skipped"
          else
            echo "No data changes to commit."
          fi

