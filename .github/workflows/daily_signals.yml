name: Daily Market Signal Bot

on:
  schedule:
    # Runs Monday through Friday at 21:00 UTC (5:00 PM EST / Market Close)
    - cron: '0 21 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  scan-and-alert:
    name: Generate Signals & Dispatch Alerts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Market Scanner
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m src.daily_scanner

      - name: Upload Daily Signals Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-signals-${{ github.run_id }}
          path: results/daily_signals_latest.json
          retention-days: 14
