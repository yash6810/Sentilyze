name: Multi-Agent Trading Committee Audit

on:
  schedule:
    # Runs Monday through Friday at 02:00 UTC (7:30 AM IST / Pre-Market Committee Deliberation)
    - cron: '0 2 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  deliberate-and-audit:
    name: Convene Multi-Agent Trading Committee
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run Multi-Agent Committee Deliberation
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.TRADE_BOT || secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u -c "from src.agent_committee import audit_full_universe_committee; audit_full_universe_committee()"

      - name: Upload Committee Resolutions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: committee-resolutions-${{ github.run_id }}
          path: results/committee_resolutions.json
          retention-days: 14

      - name: Commit & Push Updated Committee Resolutions
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/committee_resolutions.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(committee): record autonomous trading committee resolutions [skip ci]"
            git pull --rebase origin main || git pull origin main --no-rebase -X ours || true
            git push origin main || echo "No changes or push skipped"
          else
            echo "No committee resolutions changes to commit."
          fi
