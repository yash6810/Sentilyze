name: 🌐 Sentilyze 24/7 Cloud Autonomous Trading & Crypto Daemon

# Scheduled execution disabled during Strategy Freeze (2026-11-02 forward).
# Keeps only manual workflow_dispatch to guarantee autonomous_live_trader.yml is the
# SOLE automated process that commits equity state, executes trades, and updates results/.
on:
  workflow_dispatch:

concurrency:
  group: repo-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-247-cloud-daemon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Execute 24/7 Cloud Autonomous Trading Cycle
        env:
          PYTHONPATH: .
          SENTILYZE_AUTOPILOT: "true"
          MAX_CONCURRENT_POSITIONS: "10"
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scripts/run_247_daemon.py --single-run

      - name: Commit & Push Isolated Sandbox Telemetry & Lakehouse Parquet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/pilot_crypto_portfolio.json results/pilot_crypto_trades.csv results/lakehouse/
          if ! git diff --staged --quiet; then
            git commit -m "chore(autonomous): 24/7 cloud crypto sandbox & lakehouse update [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break || {
                if [ $i -eq 3 ]; then echo "Push failed after 3 attempts"; exit 1; fi
                sleep 5
              }
            done
          else
            echo "No state changes to commit."
          fi
