name: 🌐 Sentilyze 24/7 Cloud Autonomous Trading & Crypto Daemon

on:
  schedule:
    # 1. Mon-Fri: Every 15 minutes during US Market Hours (13:30 - 20:30 UTC / 09:30 - 16:30 EDT)
    - cron: '*/15 13-20 * * 1-5'
    # 2. Mon-Fri: Hourly overnight continuous scan for 24/7 Digital Assets (BTC, ETH, SOL)
    - cron: '0 0-12,21-23 * * 1-5'
    # 3. Weekends (Sat-Sun): Hourly 24/7 Crypto Funding & Arbitrage Engine
    # DISABLED (Audit Step 3): Suspended weekend hourly crypto daemon to eliminate ungrounded state churn and race conditions.
    # - cron: '0 * * * 0,6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-247-cloud-daemon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Execute 24/7 Cloud Autonomous Trading Cycle
        env:
          PYTHONPATH: .
          SENTILYZE_AUTOPILOT: "true"
          MAX_CONCURRENT_POSITIONS: "10"
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scripts/run_247_daemon.py --single-run

      - name: Commit & Push Isolated Sandbox Telemetry & Lakehouse Parquet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/pilot_crypto_portfolio.json results/pilot_crypto_trades.csv results/lakehouse/
          if ! git diff --staged --quiet; then
            git commit -m "chore(autonomous): 24/7 cloud crypto sandbox & lakehouse update [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break || {
                if [ $i -eq 3 ]; then echo "Push failed after 3 attempts"; exit 1; fi
                sleep 5
              }
            done
          else
            echo "No state changes to commit."
          fi
