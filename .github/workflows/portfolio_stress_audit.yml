name: Weekly Portfolio Stress & Black Swan Audit

on:
  # Automated schedule disabled to prevent quota exhaustion during strategy freeze
  # schedule:
  #   # Runs Sunday at 05:00 UTC (10:30 AM IST / Weekend Risk & Black Swan Audit)
  #   - cron: '0 5 * * 0'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

concurrency:
  group: repo-state
  cancel-in-progress: false

jobs:
  stress-test:
    name: Run Black Swan & Monte Carlo Risk Stress Audit
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run Black Swan Crisis Simulation Audit
        env:
          PYTHONPATH: .
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL || secrets.TRADE_BOT }}
        run: |
          python -u -c "from src.stress_tester import run_full_crisis_simulation_suite; print('Stress audit complete:', run_full_crisis_simulation_suite())"


      - name: Commit & Push Updated Risk Audit Metrics
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/black_swan_crisis_audit.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(risk): update weekly Black Swan & Monte Carlo stress test metrics [skip ci]"
            for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break || {
              if [ $i -eq 3 ]; then echo "Push failed after 3 attempts"; exit 1; fi
              sleep 5
            }
          done
          else
            echo "No risk audit changes to commit."
          fi
