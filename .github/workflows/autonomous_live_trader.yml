name: 🤖 Autonomous Live Trading & Self-Improving Agent Daemon

on:
  schedule:
    # Runs every 15 minutes during US market open hours (13:30 - 20:00 UTC, Mon-Fri)
    - cron: '7,22,37,52 13-20 * * 1-5'
  workflow_dispatch:

concurrency:
  group: live-autonomous-trader
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  execute-autonomous-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Cache Pip Wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.11.9-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.11.9-
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Verify US Market Trading Session (NYSE / NASDAQ Eastern Time)
        run: |
          python -c "from src.market_session import get_us_market_session; s = get_us_market_session(); print('🏛️ US Market Session Check:', s)"

      - name: Alpaca Broker Pre-Flight Connectivity Check
        env:
          PYTHONPATH: .
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY || secrets.APCA_API_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY || secrets.APCA_API_SECRET_KEY }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID || secrets.ALPACA_API_KEY }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY || secrets.ALPACA_SECRET_KEY }}
        run: |
          python scripts/check_alpaca_connectivity.py

      - name: Execute Autonomous Trading & Self-Improvement Loop
        env:
          PYTHONPATH: .
          SENTILYZE_AUTOPILOT: "true"
          LIVE_ALPACA_REQUIRED: "true"
          ALLOW_ALPACA_ORDER_SUBMISSION: "true"
          LEARNING_FROZEN: "true"
          MAX_CONCURRENT_POSITIONS: "10"
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY || secrets.APCA_API_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY || secrets.APCA_API_SECRET_KEY }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID || secrets.ALPACA_API_KEY }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY || secrets.ALPACA_SECRET_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

        run: |
          python -u -m src.autonomous_trader --once

      - name: Commit & Push Execution Telemetry & Funnel Log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in results/funnel_log.jsonl results/funnel.json results/funnel.md results/paper_portfolio.json results/executed_trades.csv results/autonomous_execution_log.json results/committee_resolutions.json; do
            [ -e "$f" ] && git add "$f"
          done
          git add results/news_cache_*.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto-trader): log execution cycle state & funnel telemetry [skip ci]"
            git checkout -- .
            git clean -fd
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break || {
                git rebase --abort 2>/dev/null || true
                if [ $i -eq 3 ]; then echo "Push failed after 3 attempts"; exit 1; fi
                sleep 5
              }
            done
          else
            echo "No portfolio or funnel state changes to commit."
          fi
