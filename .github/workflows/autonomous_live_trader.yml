name: 🤖 Autonomous Live Trading & News Agent Daemon

on:
  schedule:
    # Runs every 5 minutes during US market open hours (13:30 - 20:00 UTC, Mon-Fri)
    - cron: '*/5 13-20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-autonomous-trading:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Autonomous Trading Cycle
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -u -m src.autonomous_trader --once

      - name: Commit & Push Execution Telemetry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/paper_portfolio.json results/autonomous_execution_log.json results/committee_resolutions.json || true
          git diff-index --quiet HEAD || git commit -m "chore(auto-trader): log live execution cycle [skip ci]"
          git push origin main || echo "No changes or push skipped"
