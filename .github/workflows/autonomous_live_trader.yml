name: 🤖 Autonomous Live Trading & Self-Improving Agent Daemon

on:
  schedule:
    # Runs every 5 minutes during US market open hours (13:30 - 20:00 UTC, Mon-Fri)
    - cron: '*/5 13-20 * * 1-5'
  workflow_dispatch:

concurrency:
  group: repo-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  execute-autonomous-trading:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Verify US Market Trading Session (NYSE / NASDAQ Eastern Time)
        run: |
          python -c "from src.market_session import get_us_market_session; s = get_us_market_session(); print('🏛️ US Market Session Check:', s)"

      - name: Execute Autonomous Trading & Self-Improvement Loop
        env:
          PYTHONPATH: .
          SENTILYZE_AUTOPILOT: "true"
          MAX_CONCURRENT_POSITIONS: "10"
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

        run: |
          python -u -m src.autonomous_trader --once

      - name: Commit & Push Execution Telemetry (Daily Session Close Only)
        run: |
          CURRENT_HOUR=$(date -u +%H)
          if [ "$CURRENT_HOUR" -ge 20 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add results/paper_portfolio.json results/executed_trades.csv results/autonomous_execution_log.json results/committee_resolutions.json
            if ! git diff --staged --quiet; then
              git commit -m "chore(auto-trader): log daily execution cycle state [skip ci]"
              for i in 1 2 3; do
                git pull --rebase origin main && git push origin main && break || {
                  if [ $i -eq 3 ]; then echo "Push failed after 3 attempts"; exit 1; fi
                  sleep 5
                }
              done
            else
              echo "No portfolio state changes to commit."
            fi
          else
            echo "Intraday trading cycle complete. State commit scheduled for session close (>=20:00 UTC)."
          fi
