name: 🤖 Autonomous Live Trading & Self-Improving Agent Daemon

on:
  schedule:
    # Runs every 5 minutes during US market open hours (13:30 - 20:00 UTC, Mon-Fri)
    - cron: '*/5 13-20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-autonomous-trading:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Execute Autonomous Trading & Self-Improvement Loop
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u -m src.autonomous_trader --once

      - name: Commit & Push Execution Telemetry & Self-Learning Memory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/paper_portfolio.json results/autonomous_execution_log.json results/committee_resolutions.json results/agent_learning_memory.json results/*_retrain_audit.json models/*.json data/ || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto-trader): log live execution cycle & self-learning memory [skip ci]"
            git pull --rebase origin main || git pull origin main --no-rebase -X ours || true
            git push origin main || echo "No changes or push skipped"
          else
            echo "No portfolio state changes to commit."
          fi
