name: Weekly Model Retraining & Drift Check

on:
  schedule:
    # Runs every Sunday at 04:30 UTC (10:00 AM IST Sunday Morning)
    - cron: '30 4 * * 0'
  workflow_dispatch: # Allows manual 1-click trigger

jobs:
  retrain-universe:
    name: Retrain Models & Update Backtests
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Execute Full Universe Retraining
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          python train.py --all --use-cache

      - name: Upload Retrained Models & Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: retrained-models-${{ github.run_id }}
          path: |
            models/*.json
            results/*.json
            results/*.csv
            results/*.png
          retention-days: 30

      - name: Commit & Push Retrained Models & Updated Backtests
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add models/ results/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(models): weekly automated universe retraining & walk-forward calibration [skip ci]" && git push)
