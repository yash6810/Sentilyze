name: Weekly Model Retraining & Drift Check

on:
  # Automated schedule disabled to enforce the Strategy Freeze (see STRATEGY_FREEZE.md)
  # and prevent model drift during the 8-week audit scorecard evaluation window.
  # schedule:
  #   - cron: '30 4 * * 0'
  workflow_dispatch: # Allows manual 1-click trigger

concurrency:
  group: repo-state
  cancel-in-progress: false

jobs:
  retrain-universe:
    name: Retrain Models & Update Backtests
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Execute Full Universe Retraining
        env:
          PYTHONPATH: .
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL || secrets.TRADE_BOT }}
        run: |
          python -m train --all --parallel --workers 4 --use-cache


      - name: Upload Retrained Models & Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: retrained-models-${{ github.run_id }}
          path: |
            models/*.json
            results/*.json
            results/*.csv
            results/*.png
          retention-days: 30

      - name: Commit & Push Retrained Models & Updated Backtests
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/*.json results/*_metrics.json results/*_portfolio.json results/*_shap*
          git reset results/paper_portfolio.json results/executed_trades.csv results/autonomous_execution_log.json results/committee_resolutions.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(models): weekly automated universe retraining & walk-forward calibration [skip ci]"
            for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break || {
              if [ $i -eq 3 ]; then echo "Push failed after 3 attempts"; exit 1; fi
              sleep 5
            }
          done
          else
            echo "No retrained model changes to commit."
          fi
