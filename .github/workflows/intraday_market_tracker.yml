name: 5-Minute Autonomous Intraday Market Guardian

on:
  schedule:
    # Runs every 5 minutes during active US Trading Session (6:30 PM - 2:30 AM IST / 13:00 - 21:00 UTC, Mon-Fri, covering both DST & Standard Time)
    - cron: '*/5 13-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  intraday-guardian:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 5-Minute Live Market Price & Scale-Out Execution
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL || secrets.TRADE_BOT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          python -c "from src.realtime_tracker import update_live_holdings_prices_and_alert_discord; res = update_live_holdings_prices_and_alert_discord(notify_discord=True); print('Fast Intraday Holdings Price & Discord Heartbeat:', res)"

      - name: Commit Updated Paper Portfolio State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add results/paper_portfolio.json data/
          if ! git diff --staged --quiet; then
            git commit -m "chore(portfolio): 5-min intraday scale-out execution [skip ci]"
            git pull --rebase --autostash origin main || git pull origin main --no-rebase -X ours || true
            git push origin main || echo "Nothing to push"
          else
            echo "No portfolio state changes to commit."
          fi
