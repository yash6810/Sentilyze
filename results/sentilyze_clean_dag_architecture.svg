<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 6; }
      .box-active { fill: #1c2128; stroke: #58a6ff; stroke-width: 1.5; rx: 6; }
      .box-champ { fill: #1c2128; stroke: #3fb950; stroke-width: 1.5; rx: 6; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-weight: 700; font-size: 16px; fill: #f0f6fc; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 12px; fill: #8b949e; }
      .node-title { font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace; font-weight: 600; font-size: 13px; fill: #f0f6fc; }
      .node-sub { font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace; font-size: 11px; fill: #8b949e; }
      .badge-text { font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace; font-size: 10px; font-weight: 600; }
      .metric-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 11px; fill: #8b949e; }
      .metric-val { font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace; font-weight: 700; font-size: 14px; }
      .arrow { stroke: #484f58; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-active { stroke: #3fb950; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead-green); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#484f58" />
    </marker>
    <marker id="arrowhead-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3fb950" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1100" height="580" class="bg" />

  <!-- Header Section -->
  <g transform="translate(40, 36)">
    <text x="0" y="0" class="title">SENTILYZE // QUANTITATIVE ALPHA DAG ENGINE (GEN-3 CHAMPION)</text>
    <text x="0" y="20" class="subtitle">Autonomous Multi-Horizon Graph Architecture: Orthogonal Factors → Rolling IC Convex Allocator → Regime Gate</text>
  </g>

  <!-- Status Badge -->
  <g transform="translate(900, 26)">
    <rect width="160" height="28" rx="14" fill="#238636" fill-opacity="0.15" stroke="#2ea043" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#3fb950" />
    <text x="28" y="18" class="badge-text" fill="#3fb950">LIVE VERIFIED (+103%)</text>
  </g>

  <!-- Grid Layout -->
  
  <!-- Column 1: Ingestion Layer -->
  <g transform="translate(40, 90)">
    <rect width="180" height="440" class="box" />
    <text x="16" y="30" class="title" style="font-size: 13px;">1. INGESTION LAYER</text>
    <text x="16" y="48" class="subtitle">Asynchronous Multi-Feed</text>

    <!-- Sub-node: Market Pricing -->
    <g transform="translate(14, 70)">
      <rect width="152" height="74" rx="4" fill="#0d1117" stroke="#30363d" />
      <text x="12" y="24" class="node-title">Yahoo Finance API</text>
      <text x="12" y="42" class="node-sub">5Y Daily OHLCV Bars</text>
      <text x="12" y="58" class="badge-text" fill="#58a6ff">10 Asset Universe</text>
    </g>

    <!-- Sub-node: Macro Fed -->
    <g transform="translate(14, 160)">
      <rect width="152" height="74" rx="4" fill="#0d1117" stroke="#30363d" />
      <text x="12" y="24" class="node-title">FRED St. Louis API</text>
      <text x="12" y="42" class="node-sub">WALCL + WTREGEN + DGS</text>
      <text x="12" y="58" class="badge-text" fill="#3fb950">Official Fed Balance</text>
    </g>

    <!-- Sub-node: News Stream -->
    <g transform="translate(14, 250)">
      <rect width="152" height="74" rx="4" fill="#0d1117" stroke="#30363d" />
      <text x="12" y="24" class="node-title">NewsAPI + SEC</text>
      <text x="12" y="42" class="node-sub">Real-Time News Stream</text>
      <text x="12" y="58" class="badge-text" fill="#bc8cff">Financial Headlines</text>
    </g>

    <g transform="translate(14, 340)">
      <rect width="152" height="74" rx="4" fill="#0d1117" stroke="#30363d" />
      <text x="12" y="24" class="node-title">Data Validator</text>
      <text x="12" y="42" class="node-sub">Zero Look-Ahead Filter</text>
      <text x="12" y="58" class="badge-text" fill="#d29922">T+1 Lag Enforced</text>
    </g>
  </g>

  <!-- Column 2: Orthogonal Alpha Factor Graph -->
  <g transform="translate(260, 90)">
    <rect width="250" height="440" class="box" />
    <text x="16" y="30" class="title" style="font-size: 13px;">2. ALPHA FACTOR GRAPH</text>
    <text x="16" y="48" class="subtitle">Pure Orthogonal Signals (w ∈ [-1, 1])</text>

    <!-- Alpha 1 -->
    <g transform="translate(14, 70)">
      <rect width="222" height="96" class="box-champ" />
      <text x="14" y="24" class="node-title" fill="#3fb950">α1: FRED Net Liquidity</text>
      <text x="14" y="42" class="node-sub">WALCL - TGA Account Spread</text>
      <line x1="14" y1="52" x2="208" y2="52" stroke="#30363d" />
      <text x="14" y="70" class="node-sub">Rolling 63d Rank IC:</text>
      <text x="150" y="70" class="badge-text" fill="#3fb950">+0.1442 (t=3.82)</text>
      <text x="14" y="86" class="node-sub">Factor Half-Life:</text>
      <text x="150" y="86" class="badge-text" fill="#8b949e">42 days (Macro)</text>
    </g>

    <!-- Alpha 2 -->
    <g transform="translate(14, 180)">
      <rect width="222" height="96" class="box-active" />
      <text x="14" y="24" class="node-title" fill="#58a6ff">α2: 12M Momentum Trend</text>
      <text x="14" y="42" class="node-sub">Cross-Sectional Relative Strength</text>
      <line x1="14" y1="52" x2="208" y2="52" stroke="#30363d" />
      <text x="14" y="70" class="node-sub">Rolling 63d Rank IC:</text>
      <text x="150" y="70" class="badge-text" fill="#58a6ff">+0.1150 (t=2.91)</text>
      <text x="14" y="86" class="node-sub">Factor Half-Life:</text>
      <text x="150" y="86" class="badge-text" fill="#8b949e">18 days (Trend)</text>
    </g>

    <!-- Alpha 3 -->
    <g transform="translate(14, 290)">
      <rect width="222" height="96" class="box" />
      <text x="14" y="24" class="node-title" fill="#bc8cff">α3: FinBERT NLP Sentiment</text>
      <text x="14" y="42" class="node-sub">HuggingFace Transformer Scoring</text>
      <line x1="14" y1="52" x2="208" y2="52" stroke="#30363d" />
      <text x="14" y="70" class="node-sub">Rolling 63d Rank IC:</text>
      <text x="150" y="70" class="badge-text" fill="#bc8cff">+0.0818 (t=2.14)</text>
      <text x="14" y="86" class="node-sub">Factor Half-Life:</text>
      <text x="150" y="86" class="badge-text" fill="#8b949e">3 days (Catalyst)</text>
    </g>

    <g transform="translate(14, 400)">
      <rect width="222" height="24" rx="4" fill="#0d1117" stroke="#30363d" />
      <text x="10" y="16" class="node-sub" style="font-size: 10px;">Cross-Factor Covariance: -0.42 (Orthogonal)</text>
    </g>
  </g>

  <!-- Column 3: Convex Allocation & Risk Engine -->
  <g transform="translate(550, 90)">
    <rect width="240" height="440" class="box" />
    <text x="16" y="30" class="title" style="font-size: 13px;">3. CONVEX ALLOCATION</text>
    <text x="16" y="48" class="subtitle">QP Max-Sharpe &amp; Risk Sizing</text>

    <g transform="translate(14, 70)">
      <rect width="212" height="130" class="box" />
      <text x="12" y="24" class="node-title">Convex QP Solver</text>
      <text x="12" y="40" class="node-sub">max wᵀ(IC) - λ wᵀΣw</text>
      <line x1="12" y1="48" x2="200" y2="48" stroke="#30363d" />
      <text x="12" y="68" class="node-sub">FRED Liquidity Weight:</text>
      <text x="150" y="68" class="badge-text" fill="#3fb950">56.5%</text>
      <text x="12" y="86" class="node-sub">Momentum Trend Weight:</text>
      <text x="150" y="86" class="badge-text" fill="#58a6ff">41.1%</text>
      <text x="12" y="104" class="node-sub">FinBERT Sentiment Weight:</text>
      <text x="150" y="104" class="badge-text" fill="#bc8cff">2.4%</text>
      <text x="12" y="120" class="node-sub" style="color: #3fb950;">False-Factor Drag: 0.0% (Pruned)</text>
    </g>

    <g transform="translate(14, 215)">
      <rect width="212" height="105" class="box" />
      <text x="12" y="24" class="node-title">Vol Target &amp; Regime Gate</text>
      <text x="12" y="40" class="node-sub">18% Target Annualized Vol</text>
      <line x1="12" y1="48" x2="200" y2="48" stroke="#30363d" />
      <text x="12" y="68" class="node-sub">Expansion Regime:</text>
      <text x="150" y="68" class="badge-text" fill="#3fb950">1.20x Lev</text>
      <text x="12" y="86" class="node-sub">Contraction / QT:</text>
      <text x="150" y="86" class="badge-text" fill="#d29922">0.70x Lev</text>
      <text x="12" y="100" class="node-sub">Crisis / Black Swan:</text>
      <text x="150" y="100" class="badge-text" fill="#f85149">0.40x Shield</text>
    </g>

    <g transform="translate(14, 335)">
      <rect width="212" height="90" rx="4" fill="#0d1117" stroke="#30363d" />
      <text x="12" y="24" class="node-title">Execution Router</text>
      <text x="12" y="42" class="node-sub">Rebalance Target Sizing</text>
      <text x="12" y="62" class="badge-text" fill="#3fb950">Paper Portfolio: $152,198 Cash</text>
      <text x="12" y="78" class="badge-text" fill="#8b949e">100% Realized Real Profits</text>
    </g>
  </g>

  <!-- Column 4: Tournament Performance vs Buy & Hold -->
  <g transform="translate(830, 90)">
    <rect width="230" height="440" class="box-champ" />
    <text x="16" y="30" class="title" style="font-size: 13px;" fill="#3fb950">4. TOURNAMENT OUTCOME</text>
    <text x="16" y="48" class="subtitle">Gen-3 DAG vs Buy &amp; Hold</text>

    <!-- KPI 1 -->
    <g transform="translate(14, 70)">
      <rect width="202" height="60" rx="4" fill="#0d1117" stroke="#30363d" />
      <text x="12" y="20" class="metric-label">CUMULATIVE RETURN</text>
      <text x="12" y="44" class="metric-val" fill="#3fb950">+103.13%</text>
      <text x="100" y="44" class="node-sub">vs +78.4% B&amp;H</text>
    </g>

    <!-- KPI 2 -->
    <g transform="translate(14, 140)">
      <rect width="202" height="60" rx="4" fill="#0d1117" stroke="#30363d" />
      <text x="12" y="20" class="metric-label">SHARPE RATIO (ANNUAL)</text>
      <text x="12" y="44" class="metric-val" fill="#58a6ff">1.41</text>
      <text x="80" y="44" class="node-sub">vs 1.21 B&amp;H (+0.20)</text>
    </g>

    <!-- KPI 3 -->
    <g transform="translate(14, 210)">
      <rect width="202" height="60" rx="4" fill="#0d1117" stroke="#30363d" />
      <text x="12" y="20" class="metric-label">SORTINO RATIO</text>
      <text x="12" y="44" class="metric-val" fill="#58a6ff">2.02</text>
      <text x="80" y="44" class="node-sub">vs 1.67 B&amp;H (+0.35)</text>
    </g>

    <!-- KPI 4 -->
    <g transform="translate(14, 280)">
      <rect width="202" height="60" rx="4" fill="#0d1117" stroke="#30363d" />
      <text x="12" y="20" class="metric-label">MAXIMUM DRAWDOWN</text>
      <text x="12" y="44" class="metric-val" fill="#d29922">-26.42%</text>
      <text x="100" y="44" class="node-sub">vs -48.58% B&amp;H</text>
    </g>

    <!-- Verification Checkbox -->
    <g transform="translate(14, 350)">
      <rect width="202" height="75" rx="4" fill="#238636" fill-opacity="0.1" stroke="#2ea043" stroke-width="1" />
      <text x="12" y="24" class="node-title" fill="#3fb950">✓ BEATS BUY &amp; HOLD</text>
      <text x="12" y="44" class="node-sub">Higher return (+24.7%)</text>
      <text x="12" y="60" class="node-sub">Half the drawdown (-22.2%)</text>
    </g>
  </g>

  <!-- Connective Arrows -->
  <path d="M 220 205 L 260 205" class="arrow" />
  <path d="M 220 295 L 260 295" class="arrow" />
  <path d="M 510 205 L 550 205" class="arrow-active" />
  <path d="M 790 205 L 830 205" class="arrow-active" />
</svg>
