[theme]
base = "dark"
primaryColor = "#00D4AA"
backgroundColor = "#0A0E17"
secondaryBackgroundColor = "#111827"
textColor = "#E5E7EB"
font = "sans serif"

[server]
fileWatcherType = "none"
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 10
maxMessageSize = 50


[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
